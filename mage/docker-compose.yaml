version: '3.8' # Versão do Docker Compose

services:
  mage:
    image: mageai/mageai:latest # Imagem oficial do Mage.ai
    container_name: mage_ai_container # Nome amigável para o contêiner
    ports:
      - "6789:6789" # Mapeia a porta 6789 do host para a porta 6789 do contêiner (porta padrão do Mage)
    volumes:
      - ./data:/home/src # Mapeia a pasta 'data' do seu host para o diretório de trabalho do Mage.ai dentro do contêiner
    environment:
      # Variáveis de ambiente opcionais para o Mage.ai
      # - EXAMPLE_VAR=my_value
      - PROJECT_NAME=mage_test # Opcional: define um nome para o seu projeto inicial
    command: bash -c "mage start mage_test" # Comando para iniciar o Mage.ai dentro do contêiner
    restart: unless-stopped # Garante que o contêiner reinicie automaticamente se parar